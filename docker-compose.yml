services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: emergency_resource_coordination
      MYSQL_USER: ${DB_USERNAME:-lercs}
      MYSQL_PASSWORD: ${DB_PASSWORD:-lercs-dev-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-dev-password}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/emergency_resource_coordination?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${DB_USERNAME:-lercs}
      DB_PASSWORD: ${DB_PASSWORD:-lercs-dev-password}
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      JWT_SECRET: ${JWT_SECRET:-compose-development-secret-use-a-random-64-character-secret-before-deployment-123456789}
      LERCS_SEED_PASSWORD: ${LERCS_SEED_PASSWORD:-}
      CORS_ORIGIN: http://localhost:5173
      UPLOAD_DIR: /data/uploads
    volumes: [upload_data:/data/uploads]
    depends_on:
      mysql: {condition: service_healthy}
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  mysql_data:
  upload_data:
